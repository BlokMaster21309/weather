<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Weather App Starter</title>
	<link rel="stylesheet" href="styles.css" />
	<script src="myscript.js" defer></script>
</head>

<body>
	<main>
		<h1>My Weather App</h1>
		<form id="get-zip-group" action="" hidden>
			<p>
				Location failed,
				<button id="get-location-button" onclick="locationAuto()">
					Retry
				</button>
				or enter your ZIP Code instead.
			</p>
			<label for="zip-code">U.S. ZIP Code</label>
			<input id="zip-code" name="zip-code" type="text" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}"
				maxlength="5" value="01879" required />
			<button id="get-zip-button" onclick="locationZip()">Get place</button>
		</form>
		<section>
			<!-- Start these disabled -->
			<!-- They'll activate once we have a place... -->
			<button id="get-forecast-button" onclick="dailyForecast()" disabled>
				Get forecast
			</button>
			<button id="get-hourly-button" onclick="hourlyForecast()" disabled>
				Get Hourly Forecast
			</button>
			<img src="loading.webp" id="loading" title="Loading" />
		</section>

		<p id="status"></p>
		<section id="weather">
			<table>
				<tr>
					<th>The Weather</th>
					<th>Raw Forecast</th>
				</tr>
				<tr>
					<td valign="top">
						<div style="width: 21em" id="weather-summary"></div>
					</td>
					<td valign="top">
						<pre id="raw-data">Data will appear here...</pre>
					</td>
				</tr>
			</table>
			<table id="weather-table"></table>
		</section>
	</main>
	<footer>
		<p>
			<a href="citations.html">Sources &amp; acknowledgments</a>
			<a href="settings.html">Configration</a>
		</p>
	</footer>
</body>

</html>
