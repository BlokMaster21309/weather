<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>jWhar</title>
	<link rel="stylesheet" href="styles.css" />
	<meta property="og:type" content="website" />
	<meta property="og:url" content="weather.nolan.schule" />
	<meta property="og:site_name" content="Weather.Nolan.Schule" />
	<meta property="og:title" content="Weather" />
	<meta property="og:description" content="See the weather in style" />
	<meta property="og:image" content="weather.nolan.schule/favicon2.ico" />
	<meta property="og:locale" content="en_US" />
	<script src="myscript.js" defer></script>
</head>

<body>
	<main>
		<section id="get-zip-group" hidden>
			<p>
				Location failed,
				<button id="get-location-button" onclick="locationAuto()">
					Retry
				</button>
				or enter your ZIP Code instead.
			</p>
			<form action="">
				<label for="zip-code">U.S. ZIP Code</label>
				<input id="zip-code" name="zip-code" type="text" inputmode="numeric" autocomplete="postal-code"
					pattern="[0-9]{5}" maxlength="5" placeholder="i.e. 01879" required />
				<button id="get-zip-button" type="submit">Get place</button>
			</form>
		</section>
		<section id="get-forecast-group">
			<!-- Start these disabled -->
			<!-- They'll activate once we have a place... -->
			<button id="get-forecast-button" onclick="dailyForecast()" disabled>
				Get forecast
			</button>
			<button id="get-hourly-button" onclick="hourlyForecast()" disabled>
				Get Hourly Forecast
			</button>
			<img src="loading.webp" id="loading-indicator" title="Loading" />
		</section>

		<p id="status"></p>
		<table id="weather">
			<tr id="weather-time">
			</tr>
			<tr id="weather-image">
			</tr>
			<tr id="weather-temperature">
			</tr>
			<tr id="weather-wind">
			</tr>
			<tr id="weather-precipitation">
			</tr>
			<tr id="weather-forecast">
			</tr>
		</table>
		</section>
	</main>
	<footer>
		<p>
			<a href="citations.html">Sources &amp; acknowledgments</a>
			<a href="settings.html">Configration</a>
			<button onclick="unhide()">Unhide Inputs</button>
		</p>
	</footer>
</body>

</html>
